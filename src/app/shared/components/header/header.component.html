<header class="site-header">
  <div class="container header-inner">

    <a
      routerLink="/home"
      class="brand"
      aria-label="ATNAV Home"
    >

    <span class="brand-mark">
  <img
    src="assets/icon/favicon.png"
    alt="ATNAV"
  />
</span>


      <span class="brand-name">
        ATNAV
      </span>
    </a>

    <nav
      class="desktop-nav"
      aria-label="Primary navigation"
    >
      <!-- <a
        routerLink="/services"
        routerLinkActive="active"
      >
        Services
      </a> -->

      <a
        routerLink="/process"
        routerLinkActive="active"
      >
        How We Work
      </a>

      <a
        routerLink="/work"
        routerLinkActive="active"
      >
        Our Work
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
      >
        About Us
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
      >
        Contact Us
      </a>
    </nav>

    <a
      routerLink="/contact"
      class="start-project"
    >
      <span>Start a Project</span>
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </a>

    <button
      type="button"
      class="mobile-menu-btn"
      [class.open]="menuOpen"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
    </button>

  </div>

  <div
    class="mobile-panel"
    [class.open]="menuOpen"
  >
    <div class="container mobile-panel-inner">

      <nav
        class="mobile-nav"
        aria-label="Mobile navigation"
      >

        <a
          routerLink="/services"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <span>Services</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </a>

        <a
          routerLink="/process"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <span>How We Work</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </a>

        <a
          routerLink="/work"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <span>Our Work</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </a>

        <a
          routerLink="/about"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <span>About Us</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </a>

        <a
          routerLink="/contact"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <span>Contact Us</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </a>

      </nav>

      <a
        routerLink="/contact"
        class="mobile-cta"
        (click)="closeMenu()"
      >
        <span>Start a Project</span>
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </a>

    </div>
  </div>
</header>
